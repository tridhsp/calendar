<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Teacher Planner</title>

  <link rel="icon" type="image/png" sizes="32x32"
        href="https://files.tansinh.info/ads/tridhsp_1752750602636_ad_tridhsp_1752750602636.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css?v=20260518_2153_1514" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.js" defer></script>
  <script src="./teacherplanner.js?v=20260518_2153_1514" defer></script>
</head>
<body class="app-mode">

  <main class="board" id="plannerBoard">
    <div class="board-header">
      <h1><i class="fa-solid fa-timeline"></i> Teacher Planner</h1>

      <div class="view-toggle">
        <label class="toggle" style="gap:10px; cursor:default;">
          <i class="fa-solid fa-user-tie"></i>
          <select id="plannerTeacher" style="border:none; background:transparent; font-weight:700;">
            <option>Loading…</option>
          </select>
        </label>
        <button id="plannerRefresh" class="icon-btn" title="Refresh">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
      </div>
    </div>

    <div id="plannerContent"></div>
  </main>

  <!-- Bottom-right: go back to Teacher Calendars -->
  <a href="./teachercalendar.html"
     class="teacher-calendar-chip"
     title="Back to Teacher Calendars"
     aria-label="Back to Teacher Calendars">
    <span class="icon" aria-hidden="true">↩️</span>
    <span class="label">Back</span>
  </a>
</body>
</html>
