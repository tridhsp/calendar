<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lịch học · Board</title>
  <link rel="icon" type="image/png" sizes="32x32"
    href="https://files.tansinh.info/ads/tridhsp_1752750602636_ad_tridhsp_1752750602636.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css?v=20260908_1119board_20260908f" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="./board.css?v=20260908_1119board_20260908f" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.js" defer></script>
  <script src="./board.js?v=20260908_1119board_20260908f" defer></script>
</head>
<body class="cb-body">

  <div class="card" id="loginCard" style="display:none">
    <div class="logo">Calendar</div>
    <div class="subtitle">Đăng nhập bằng email &amp; mật khẩu của bạn</div>
    <div class="field"><input id="email" type="email" autocomplete="username" placeholder="Email" required /></div>
    <div class="field">
      <input id="password" type="password" autocomplete="current-password" placeholder="Mật khẩu" required />
      <button class="toggle-password" id="togglePwd" aria-label="Hiện/ẩn mật khẩu">👁️</button>
    </div>
    <button class="btn" id="login">Đăng nhập</button>
    <div id="message" aria-live="polite"></div>
  </div>

  <main id="cbBoard" class="cb-board hidden" aria-live="polite">
    <header class="cb-head">
      <h1><i class="fa-solid fa-calendar-week"></i> Lịch học</h1>
      <div class="cb-head-actions">
        <a href="./index.html" class="cb-link" title="Trang cũ"><i class="fa-solid fa-table-columns"></i> Bảng cũ</a>
        <button type="button" class="cb-icon" id="cbRefresh" title="Tải lại"><i class="fa-solid fa-rotate-right"></i></button>
      </div>
    </header>

    <div class="cb-filters">
      <div class="cb-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="cbSearch" type="text" placeholder="Tìm học viên…" autocomplete="off" />
        <button type="button" id="cbSearchClear" class="cb-clear" title="Xoá" aria-label="Xoá tìm kiếm"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <select id="cbTeacher" class="cb-select"><option value="">Tất cả GV</option></select>
      <button type="button" id="cbMissing" class="cb-chip cb-chip-danger" aria-pressed="false">
        <i class="fa-solid fa-user-xmark"></i> Chưa có GV <span class="cb-chip-n" id="cbMissingN">0</span>
      </button>
      <button type="button" id="cbDirtyOnly" class="cb-chip" aria-pressed="false" hidden>
        <i class="fa-solid fa-pen"></i> Chưa lưu <span class="cb-chip-n" id="cbDirtyN">0</span>
      </button>
      <span class="cb-count" id="cbCount"></span>
      <button type="button" id="cbSideToggle" class="cb-chip" aria-pressed="true" title="Ẩn/hiện bảng Cần gán GV">
        <i class="fa-solid fa-table-columns"></i> Cần gán GV <span class="cb-chip-n">0</span>
      </button>
      <div class="cb-add">
        <i class="fa-solid fa-user-plus"></i>
        <input id="cbAddInput" type="text" placeholder="Thêm học viên (gõ 3+ ký tự email)…" autocomplete="off" />
        <div id="cbAddList" class="cb-add-list" hidden></div>
      </div>
    </div>

    <div class="cb-layout">
      <div class="cb-main">
        <div id="cbList" class="cb-list"></div>
        <div id="cbEmpty" class="cb-empty" hidden>Không có học viên nào khớp bộ lọc.</div>
      </div>
      <aside class="cb-side" id="cbSide" aria-label="Học viên cần gán giáo viên"></aside>
    </div>
  </main>

  <div id="cbSpinner" class="cb-spinner" hidden><i class="fa-solid fa-circle-notch fa-spin"></i></div>
</body>
</html>
