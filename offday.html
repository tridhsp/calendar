    <style>
        /* Bottom-left double FABs */
        /* Pin the stack to the real bottom-left */
        .off-fab-wrap {
            position: fixed;
            left: 0;
            /* flush left */
            bottom: 0;
            /* flush bottom */
            padding: 8px;
            /* set to 0 if you want zero breathing room */
            display: flex;
            flex-direction: column-reverse;
            /* Student closest to corner; change to column if you want Teacher at bottom */
            gap: 8px;
            align-items: flex-start;
            z-index: 1000;
        }

        /* Remove default FAB offsets coming from .calendar-fab */
        .calendar-fab.off-fab {
            position: static !important;
            /* not fixed or relative */
            inset: auto !important;
            /* resets top/right/bottom/left */
            margin: 0 !important;
        }


        .off-fab {
            /* Reuse your .calendar-fab look; add our tweaks */
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 9999px;
            box-shadow: var(--elev-3, 0 6px 20px rgba(0, 0, 0, .15));
        }

        .off-fab[title] {
            cursor: pointer;
        }

        /* Modal width sweet spot */
        #offdayModal .modal {
            width: min(560px, 96vw);
        }

        /* Suggestions dropdown under the name input */
        .name-suggestions {
            position: relative;
            margin-top: 6px;
        }

        .name-suggestions[hidden] {
            display: none;
        }

        .name-suggestions .list {
            position: absolute;
            top: 0;
            /* anchor to the container top-left (which sits below your input) */
            left: 0;
            z-index: 60;
            min-width: 280px;
            max-width: 96vw;
            max-height: 240px;
            overflow: auto;
            background: #fff;
            border: 1px solid var(--border, #e5e7eb);
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .12);
            padding: 6px;
        }


        .name-suggestions .item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
        }

        .name-suggestions .item:hover,
        .name-suggestions .item[aria-selected="true"] {
            background: #f1f5f9;
        }


        /* Inline meta row for date + weekday */
        .meta-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: center;
        }

        /* Weekday pill – compact & polished */
        .weekday-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            font-weight: 600;
            white-space: nowrap;
        }

        .weekday-pill .dow {
            background: #e6f0ff;
            color: #1d4ed8;
            border-radius: 9999px;
            padding: 3px 8px;
            font-weight: 700;
        }

        .weekday-pill .sep {
            opacity: .5;
        }

        .weekday-pill .date {
            font-weight: 600;
        }

        .weekday-empty {
            opacity: .6;
            font-weight: 500;
        }


        .weekday-empty {
            opacity: .6;
            font-weight: 500;
        }

        /* ===== Popup make-over (applies to Student & Teacher) ===== */
        #offdayModal {
            /* ensure hidden uses display:none for layout correctness */
            display: block;
        }

        #offdayModal[hidden] {
            display: none;
        }

        /* Backdrop styling (covers both by id+class and by class) */
        #offdayModal.modal-backdrop,
        .modal-backdrop {
            position: fixed;
            inset: 0;
            /* covers top/right/bottom/left */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(2, 6, 23, .45);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }


        #offdayModal .modal {
            width: min(640px, 96vw);
            /* a bit wider */
            border-radius: 16px;
            border: 1px solid rgba(15, 23, 42, .08);
            background: #ffffff;
            box-shadow: 0 24px 60px rgba(2, 6, 23, .25);
            overflow: hidden;
            /* crisp rounded corners */
            animation: modalIn .18s ease-out;
        }

        #offdayModal .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 14px 18px;
            border-bottom: 1px solid #eef2f7;
            background: linear-gradient(180deg, #f8fafc, #ffffff);
        }

        #offdayModal .modal-header h2 {
            font-size: 1.05rem;
            font-weight: 700;
            margin: 0;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        #offdayModal .modal-close {
            font-size: 20px;
            line-height: 1;
            width: 32px;
            height: 32px;
            border-radius: 8px;
        }

        #offdayModal .modal-close:hover {
            background: #f1f5f9;
        }

        #offdayModal .modal-body {
            padding: 18px;
            overflow: visible;
            /* so suggestions can pop over */
        }

        #offdayModal .section-title {
            margin-top: 4px;
            font-weight: 600;
        }

        #offdayModal .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            padding: 14px 18px;
            border-top: 1px solid #eef2f7;
            background: #fff;
        }

        /* Inputs inside the modal */
        /* Inputs inside the modal */
        #offdayModal .form-group input[type="text"] {
            width: 100%;
            height: 40px;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            padding: 8px 12px;
            outline: none;
        }

        /* Reason textarea */
        #offdayModal textarea {
            width: 100%;
            min-height: 84px;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            padding: 10px 12px;
            outline: none;
            resize: vertical;
            /* allow grow/shrink */
        }

        #offdayModal textarea:focus {
            border-color: #93c5fd;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, .15);
        }


        /* Date input is styled separately below */


        #offdayModal .form-group input[type="text"]:focus,
        #offdayModal input[type="date"]:focus {
            border-color: #93c5fd;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, .15);
        }

        /* Weekday pill refinement */
        #offdayModal .weekday-pill {
            border-radius: 12px;
            background: #f8fafc;
            border-color: #e2e8f0;
        }

        /* Suggestion list looks like a native dropdown */
        .name-suggestions {
            position: relative;
            margin-top: 6px;
        }

        .name-suggestions .list {
            position: absolute;
            top: 0;
            left: 0;
            width: max(100%, 280px);
            max-width: 96vw;
            max-height: 240px;
            overflow: auto;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            box-shadow: 0 12px 30px rgba(2, 6, 23, .18);
            padding: 4px;
        }

        .name-suggestions .item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
        }

        .name-suggestions .item:hover {
            background: #f1f5f9;
        }

        /* subtle entrance */
        @keyframes modalIn {
            from {
                transform: translateY(8px) scale(.98);
                opacity: 0;
            }

            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        /* Make primary button feel clickable without touching your global .btn styles */
        #offdayModal .btn-primary {
            border-radius: 12px;
            padding: 10px 14px;
            font-weight: 600;
            box-shadow: 0 6px 20px rgba(37, 99, 235, .25);
        }

        #offdayModal .btn-secondary {
            border-radius: 12px;
        }

        /* Date input group */
        .date-field {
            position: relative;
            width: 100%;
        }

        .date-field input[type="date"] {
            width: 100%;
            height: 44px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            /* left 40px for the icon, right 44px for the clear button */
            padding: 10px 44px 10px 40px !important;
            outline: none;
        }



        .date-field input[type="date"]:focus {
            border-color: #93c5fd;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, .15);
        }

        .date-field .date-icon {
            position: absolute;
            left: 12px;
            /* move to left */
            right: auto;
            top: 50%;
            transform: translateY(-50%);
            opacity: .6;
            pointer-events: auto;
            /* clickable */
            cursor: pointer;
            font-size: 16px;
        }


        .date-field .date-clear {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            border-radius: 9999px;
            border: 0;
            background: #f1f5f9;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
        }

        .date-field .date-clear:hover {
            background: #e2e8f0;
        }

        #offdayModal input[type="date"]::-webkit-calendar-picker-indicator {
            display: none;
            /* Chrome/Safari */
        }

        /* ===== Header polish (pills, inputs, counts) ===== */
        .off-header {
            background: #fff;
            border: 1px solid #eef2f7;
            border-radius: 16px;
            box-shadow: 0 10px 24px rgba(16, 24, 40, .06);
            padding: 12px;
            margin-top: 12px;
            margin-bottom: 14px;
            display: grid;
            gap: 10px;
        }

        .off-header-row {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .off-title {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 0;
            font-size: 1.1rem;
            color: #0f172a;
        }

        .off-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .off-input {
            height: 40px;
            padding: 10px 12px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            background: #f9fafb;
            outline: none;
        }

        .off-input:focus {
            border-color: #93c5fd;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, .15);
        }

        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            background: #fff;
            cursor: pointer;
        }

        .icon-btn:hover {
            filter: brightness(.98);
        }

        .off-pills {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 9999px;
            border: 1px solid #e5e7eb;
            background: #f8fafc;
            font-weight: 700;
            cursor: pointer;
        }

        .pill.active {
            background: #eff6ff;
            border-color: #bfdbfe;
        }

        .count-badge {
            display: inline-grid;
            place-items: center;
            min-width: 22px;
            height: 22px;
            padding: 0 6px;
            border-radius: 9999px;
            background: #0ea5e9;
            color: #fff;
            font-weight: 800;
            font-size: 12px;
        }

        .summary-bar {
            display: flex;
            gap: 8px;
            align-items: center;
            color: #334155;
            font-weight: 700;
        }

        .summary-bar .dot {
            width: 8px;
            height: 8px;
            border-radius: 9999px;
            background: #94a3b8;
        }


        /* ========== OFFDAY PANELS ========== */
        .offdays-section {
            margin-top: 16px;
        }

        /* --- Visual upgrade for day cards & rows --- */
        .day-card {
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 10px 24px rgba(16, 24, 40, .06);
            overflow: hidden;
        }



        .day-head .day-count {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            height: 24px;
            padding: 0 10px;
            border-radius: 9999px;
            background: #e0f2fe;
            color: #075985;
            font-weight: 800;
            font-size: 12px;
            border: 1px solid #bae6fd;
        }

        .day-items {
            padding: 12px;
            display: grid;
            gap: 10px;
        }

        /* Offday rows: simple stack, no avatar column */
        .offday-list .day-item {
            position: relative;
            display: block;
            padding: 12px 14px;
            border: 1px solid #eef2f7;
            /* lighter border */
            border-radius: 12px;
            background: #ffffff;
            transition: border-color .15s ease, box-shadow .15s ease, transform .05s ease;
            box-shadow: 0 2px 10px rgba(2, 6, 23, 0.03);
            /* very soft lift */
        }


        /* Slightly larger student name for readability */
        .offday-list .day-item .name {
            font-size: 15px;
        }


        /* Make the student's name look like a header banner */
        .offday-list .day-item .name {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 10px;
            background: #f1f5f9;
            /* light slate */
            border: 1px solid #e5e7eb;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 6px;
        }

        /* Colorful variant for the student name chip (uses a hue from JS) */
        .offday-list .day-item .name.colorful {
            background: hsl(var(--chip-h, 210) 100% 97%);
            border-color: hsl(var(--chip-h, 210) 80% 85%);
            color: hsl(var(--chip-h, 210) 30% 28%);
            box-shadow: inset 0 0 0 1px hsl(var(--chip-h, 210) 70% 88% / .6);
        }


        /* small calendar/user icon before the name for scannability */
        .offday-list .day-item .name::before {
            content: "\f133";
            /* fa-regular fa-calendar-days */
            font-family: "Font Awesome 6 Free";
            font-weight: 400;
            opacity: .7;
        }

        /* Increase gap between student rows inside one day */
        .day-items {
            gap: 14px;
        }


        /* Alternating row background inside a day card (super subtle) */
        .day-list .day-item:nth-child(even) {
            background: #fbfcfe;
            /* hint of blue/white */
        }

        /* A dashed divider between student rows inside the same day */
        .day-list .day-item:not(:last-child) {
            border-bottom: 1px dashed #e5e7eb;
            padding-bottom: 12px;
        }

        /* keep the gap visually balanced */
        .day-list .day-item+.day-item {
            margin-top: 8px;
        }

        /* subtle hover */
        .offday-list .day-item:hover {
            border-color: #dbeafe;
            box-shadow: 0 6px 18px rgba(2, 6, 23, 0.06);
        }




        /* Teacher = blue, Student = green */
        .day-card.teacher .day-item::before {
            --row-accent: #93c5fd;
        }

        .day-card.student .day-item::before {
            --row-accent: #86efac;
        }

        /* text */
        .offday-list .day-item .name {
            font-weight: 800;
            color: #0f172a;
        }

        .offday-list .day-item .reason {
            color: #475569;
            margin-top: 4px;
        }

        /* impacts (chips) — small top gap */
        .impacts {
            margin-top: 8px;
        }

        /* Impacted-student pills: alert by default, turn OK when assigned */
        .impacts .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 9999px;
            font-weight: 700;
            border: 1px solid #e5e7eb;
            background: #fff;
        }

        /* RED alert (unassigned) */
        .impacts .chip.alert {
            background: #fff1f2;
            /* light red/pink */
            border-color: #fecdd3;
            color: #be123c;
        }

        /* Friendly OK (assigned) */
        .impacts .chip.ok {
            background: #ecfeff;
            /* light cyan/blue */
            border-color: #bae6fd;
            color: #075985;
        }


        /* === Assign panel (replacement teacher) === */
        .assign-panel {
            margin-top: 10px;
            border-top: 1px dashed #e5e7eb;
            padding-top: 10px;
        }

        .assign-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 800;
            padding: 6px 10px;
            border-radius: 9999px;
            border: 1px solid #e5e7eb;
            background: #f8fafc;
            cursor: pointer;
        }

        .assign-toggle i {
            opacity: .7;
        }

        .assign-body {
            margin-top: 10px;
            display: grid;
            gap: 8px;
            background: #f8fafc;
            border: 1px dashed #e5e7eb;
            border-radius: 10px;
            padding: 10px;
        }


        .assign-row {
            display: grid;
            grid-template-columns: 1fr 220px 1fr auto;
            /* student | select | note | button */
            gap: 8px;
            align-items: center;
            padding: 8px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: #f9fafb;
        }

        .assign-student {
            font-weight: 800;
            color: #0f172a;
        }

        .assign-select,
        .assign-note {
            height: 36px;
            padding: 6px 10px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: #fff;
            outline: none;
        }

        .assign-select:focus,
        .assign-note:focus {
            border-color: #93c5fd;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, .15);
        }

        .btn-assign {
            height: 36px;
            padding: 0 12px;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            background: #e0f2fe;
            border: 1px solid #93c5fd;
            color: #075985;
        }

        .btn-assign:hover {
            filter: brightness(.97);
        }



        @media (max-width: 900px) {
            .assign-row {
                grid-template-columns: 1fr;
            }
        }


        .offdays-title {
            margin: 10px 0 8px;
            font-weight: 700;
            font-size: 1.05rem;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .offday-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            /* 2 cards per row */
            gap: 12px;
            align-items: start;
            /* keep uneven heights tidy */
        }

        /* Phones/tablets: back to one column */
        @media (max-width: 900px) {
            .offday-list {
                grid-template-columns: 1fr;
            }
        }


        .offday-empty {
            padding: 14px;
            border: 1px dashed #e5e7eb;
            border-radius: 12px;
            background: #f8fafc;
            color: #64748b;
            font-size: .95rem;
        }

        .day-card {
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 8px 22px rgba(2, 6, 23, .06);
            overflow: hidden;
        }

        .day-head {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            background: #ffffff;
            border-bottom: 1px solid #eef2f7;
            font-weight: 800;
        }

        .day-head .dow-chip {
            background: #e0e7ff;
            color: #1d4ed8;
            border-radius: 9999px;
            padding: 4px 10px;
            font-weight: 900;
        }

        /* grid handles spacing now */
        .day-card {
            margin-bottom: 0;
        }

        .day-head .dow-chip {
            background: #e6f0ff;
            color: #1d4ed8;
            border-radius: 9999px;
            padding: 3px 8px;
            font-weight: 700;
        }

        .day-items {
            padding: 10px 12px;
            display: grid;
            gap: 10px;
            background: #f8fafc;
        }



        .offday-list .day-item .name {
            font-weight: 800;
        }

        .offday-list .day-item .reason {
            color: #475569;
            opacity: .9;
        }

        /* make header content left-leaning too */
        .day-head {
            justify-content: flex-start;
        }

        /* Offday: never show initials bubble/avatar */
        .offday-list .avatar,
        .day-item>.avatar {
            display: none !important;
        }


        /* Subtle lift on hover so each card feels separate */
        .day-card {
            transition: box-shadow .18s ease, transform .06s ease, border-color .18s ease;
        }

        .day-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 32px rgba(16, 24, 40, .10);
            border-color: #e3e7ef;
        }

        /* === Dotted borders per card (color rotates automatically) === */

        /* Make the card border dotted and a bit thicker */
        .day-card {
            border-width: 2px !important;
            border-style: dotted !important;
            border-color: var(--card-border, #cbd5e1) !important;
            /* default if no color set */
            transition: border-color .18s ease, box-shadow .18s ease, transform .06s ease;
        }

        /* Slight lift on hover (keeps your existing feel) */
        .day-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 32px rgba(16, 24, 40, .10);
        }

        /* Rotate border colors for each card within a section */
        .offdays-section .day-card:nth-of-type(8n+1) {
            --card-border: #60a5fa;
        }

        /* blue */
        .offdays-section .day-card:nth-of-type(8n+2) {
            --card-border: #34d399;
        }

        /* emerald */
        .offdays-section .day-card:nth-of-type(8n+3) {
            --card-border: #f59e0b;
        }

        /* amber */
        .offdays-section .day-card:nth-of-type(8n+4) {
            --card-border: #f472b6;
        }

        /* pink */
        .offdays-section .day-card:nth-of-type(8n+5) {
            --card-border: #a78bfa;

        /* shows latest note in view mode (middle column) */

            color: #475569;
            font-size: .95rem;
            display: flex;
            gap: 8px;
            align-items: center;

            white-space: normal;
            /* was nowrap */

            /* was hidden */

        /* Let grid items actually shrink inside the 2-column list */
        .offday-list .day-item,
        .assign-row,
        .assign-select,

        /* Make the select column flexible instead of a hard 220px */

        /* Ensure inputs fill their cell but don't force overflow */
        .assign-select,
        .assign-note {
            width: 100%;
            box-sizing: border-box;

        /* New stacking context per card so nothing bleeds over neighbors */
        .day-card {
            position: relative;
            isolation: isolate;
            /* prevents a tall card from intercepting clicks over the next column */
        }

        /* Collapse to single column earlier so medium screens aren't cramped */
        @media (max-width: 1200px) {
            .offday-list {

        }

        /* Medium fallback: make assign row wrap before 900px if space is tight */
        @media (max-width: 1100px) {
            .assign-row {

        /* small pencil button */

        /* In view mode (assigned), collapse to 3 columns with a wide middle cell */

<body>

    <!-- Login Card (shown only when not authenticated) -->
    <div class="card" id="loginCard" style="display:none">
        <div class="logo">Off Days</div>
        <div class="subtitle">Đăng nhập bằng email &amp; mật khẩu của bạn</div>

            <input id="email" type="email" autocomplete="username" placeholder="Email" required />
        </div>

        <div class="field">
            <input id="password" type="password" autocomplete="current-password" placeholder="Mật khẩu" required />
            <button class="toggle-password" id="togglePwd" aria-label="Hiện/ẩn mật khẩu">👁️</button>
        </div>

        <button class="btn" id="login">Đăng nhập</button>

    <main id="offdayBoard" class="board hidden" aria-live="polite">
        <section class="off-header" aria-label="Offday controls">
            <div class="off-header-row">
                <h1 class="off-title"><i class="fa-regular fa-calendar-xmark"></i> Off Days</h1>
                <div class="off-controls">
                    <select id="windowPreset" class="off-input" title="Window preset">

                    <button id="clearWeekBtn" class="icon-btn" title="Back to preset">

                    </button>

                    <input id="nameFilter" class="off-input" placeholder="Filter by name…"
                        aria-label="Filter by name" />
                    <button id="refreshBtn" class="icon-btn" title="Refresh"><i
                            class="fa-solid fa-rotate-right"></i></button>
                </div>
            </div>

            <div class="off-header-row">
                <div class="off-pills" role="tablist" aria-label="Who">

                    <button class="pill" role="tab" aria-selected="false" id="tabStudents">

    <!-- Bottom-left: two FABs -->

            aria-label="Open Teacher OFF days popup" title="Teacher off days">
            <i class="fa-solid fa-chalkboard-user" aria-hidden="true"></i>
        </button>

    <!-- Shared Modal for Student/Teacher -->
    <div class="modal-backdrop" id="offdayModal" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="offdayTitle">
            <div class="modal-header">

                    <i class="fa-regular fa-calendar-xmark"></i>

                    <textarea id="offReason" rows="3" placeholder="Enter reason (optional)…"></textarea>

                </button>

            </div>

    <script>
        const $ = (sel) => document.querySelector(sel);

        // ---- AUTH/UI HELPERS ----
        function showOffdayApp() {
            // hide login
            const card = document.getElementById('loginCard');
            if (card) card.style.display = 'none';

            // show app
            document.body.classList.add('app-mode');
            document.getElementById('offdayBoard')?.classList.remove('hidden');

            // show FABs
            const fabs = document.getElementById('offFabs');
            if (fabs) fabs.style.display = '';

            // add logout button once
            let btn = document.getElementById('logoutBtn');
            if (!btn) {
                btn = document.createElement('button');
                btn.id = 'logoutBtn';
                btn.className = 'logout-icon';
                btn.title = 'Log out';
                btn.setAttribute('aria-label', 'Log out');
                btn.innerHTML = '<i class="fa-solid fa-power-off" aria-hidden="true"></i>';
                btn.addEventListener('click', async () => { await client.auth.signOut(); });
                document.body.appendChild(btn);
            }

            // load data after auth
            refreshOffdayPanels();
        }

        function showLoginOnly() {
            // show login
            const card = document.getElementById('loginCard');
            if (card) card.style.display = 'block';

            // hide app
            document.getElementById('offdayBoard')?.classList.add('hidden');
            document.body.classList.remove('app-mode');

            // hide FABs
            const fabs = document.getElementById('offFabs');
            if (fabs) fabs.style.display = 'none';

            // remove logout button if present
            const btn = document.getElementById('logoutBtn');
            if (btn) btn.remove();

            // focus email
            document.getElementById('email')?.focus();
        }

        // Toggle eye for password
        function setupPasswordToggle() {
            const toggle = document.getElementById('togglePwd');
            if (!toggle) return;
            toggle.addEventListener('click', () => {
                const pwd = document.getElementById('password');
                if (!pwd) return;
                pwd.type = (pwd.type === 'password') ? 'text' : 'password';
            });
        }

        // Email/password login
        function setupLoginHandler() {
            const btn = document.getElementById('login');
            if (!btn) return;

            const submit = async () => {
                const msgEl = document.getElementById('message');
                if (msgEl) { msgEl.textContent = ''; msgEl.className = ''; }

                if (!client) {
                    if (msgEl) msgEl.textContent = 'Đang kết nối, vui lòng đợi…';
                    const _tsWaitStart = Date.now();
                    while (!client && Date.now() - _tsWaitStart < 5000) {
                        await new Promise((r) => setTimeout(r, 200));
                    }
                    if (!client) {
                        if (msgEl) msgEl.textContent = 'Không kết nối được máy chủ, vui lòng tải lại trang.';
                        return;
                    }
                    if (msgEl) msgEl.textContent = '';
                }

                const email = (document.getElementById('email')?.value || '').trim();
                const password = document.getElementById('password')?.value || '';

                if (!email || !password) {
                    if (msgEl) { msgEl.textContent = 'Vui lòng điền đầy đủ thông tin.'; msgEl.className = 'error'; }
                    return;
                }

                const { error } = await client.auth.signInWithPassword({ email, password });
                if (error && msgEl) {
                    msgEl.textContent = error.message;
                    msgEl.className = 'error';
                }
            };

            btn.addEventListener('click', submit);
            document.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
        }


        // Simple debounce to limit queries while typing
        function debounce(fn, ms = 200) {
            let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
        }


        // Query Supabase for suggestions from user_roles (case-insensitive role filters)
        async function fetchNameSuggestions(term) {
            if (!client) return [];

            let q = client.from('user_roles')
                // NOTE: user_roles has 'uid' (not 'id'); we don't actually need it for the UI
                .select('full_name, email, role')


                .ilike('full_name', `%${term}%`)
                .order('full_name', { ascending: true })
                .limit(7);

            if (currentMode === 'student') {
                // exclude Teachers for the student popup
                q = q.neq('role', 'Teacher');
            } else {
                // include only Teacher/Admin/Super Admin for the teacher popup
                q = q.in('role', ['Teacher', 'Admin', 'Super Admin']);
            }

            const { data, error } = await q;
            if (error) {
                console.error('suggest error', error); // keep this for debug
                return [];
            }
            return data || [];
        }



        function renderSuggestions(items) {
            const wrap = $('#nameSuggestions');
            if (!wrap) return;
            if (!items.length) { wrap.hidden = true; wrap.innerHTML = ''; return; }

            const list = document.createElement('div');
            list.className = 'list';
            list.setAttribute('role', 'listbox');

            items.forEach((row, idx) => {
                const btn = document.createElement('div');
                btn.className = 'item';
                btn.setAttribute('role', 'option');
                btn.setAttribute('data-name', row.full_name);
                btn.setAttribute('data-email', row.email || '');
                btn.setAttribute('tabindex', '-1');
                btn.innerHTML = `
  <i class="fa-regular fa-user"></i>
  <span class="name">${row.full_name}</span>
  <span class="email">&nbsp;•&nbsp;${row.email || ''}</span>
`;


                btn.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    const name = btn.getAttribute('data-name') || '';
                    const email = btn.getAttribute('data-email') || '';
                    $('#offEntityName').value = name;
                    selectedEntityEmail = email || null;
                    wrap.hidden = true;
                    wrap.innerHTML = '';
                });

                list.appendChild(btn);
            });

            wrap.innerHTML = '';
            wrap.appendChild(list);
            wrap.hidden = false;
        }

        // Debounced input handler
        const debouncedSuggest = debounce(async () => {
            // typing means the current pick is no longer reliable
            selectedEntityEmail = null;

            const term = ($('#offEntityName')?.value || '').trim();
            if (term.length < 4) {
                $('#nameSuggestions').hidden = true;
                $('#nameSuggestions').innerHTML = '';
                return;
            }
            const results = await fetchNameSuggestions(term);
            renderSuggestions(results);
        }, 250);



        // --- Supabase bootstrap (uses your Netlify function) ---
        // --- Supabase bootstrap (uses your Netlify function) ---
        let client;

        // wait until the UMD has defined window.supabase
        async function ensureSupabaseLoaded(maxTries = 50) {
            let tries = 0;
            while (!window.supabase) {
                await new Promise(r => setTimeout(r, 100));
                if (++tries >= maxTries) throw new Error('Supabase UMD not loaded');
            }
        }

        async function initSupabase() {
            try {
                await ensureSupabaseLoaded(); // <-- ensure UMD is ready
                const res = await fetch('/api/cal-supabase-credentials');
                if (!res.ok) throw new Error('Failed to load credentials');
                const { SUPABASE_URL, ANON_PUBLIC_KEY } = await res.json();
                client = window.supabase.createClient(SUPABASE_URL, ANON_PUBLIC_KEY, {
                    auth: { persistSession: true, autoRefreshToken: true, storage: window.localStorage, detectSessionInUrl: true }
                });

                // Check current session and show the right UI
                const { data: { session } } = await client.auth.getSession();
                if (session) {
                    showOffdayApp();
                } else {
                    showLoginOnly();
                }

                // React to future login/logout
                client.auth.onAuthStateChange((_event, session) => {
                    if (session) showOffdayApp();
                    else showLoginOnly();
                });

            } catch (e) {
                console.error('Supabase init failed:', e);
            }
        }

        initSupabase();
        setInterval(() => { if (client) ensureAuthFresh().catch(() => { }); }, 60_000);


        // Ensure our Supabase session is present & fresh before making writes
        async function ensureAuthFresh() {
            if (!client) throw new Error('Supabase not ready');

            // 1) Try to use current session
            let { data: { session } } = await client.auth.getSession();

            // 2) If missing, try to silently refresh using stored refresh_token
            if (!session) {
                const { data, error } = await client.auth.refreshSession();
                if (error || !data?.session) {
                    showLoginOnly();               // show login again if refresh isn’t possible
                    throw new Error('Not authenticated. Please log in again.');
                }
                session = data.session;
            }

            // 3) If session is about to expire (<60s), refresh it
            const expMs = session.expires_at ? session.expires_at * 1000 : 0;
            if (expMs && expMs - Date.now() < 60_000) {
                const { error } = await client.auth.refreshSession();
                if (error) {
                    showLoginOnly();
                    throw error;
                }
            }

            return session; // handy if you want it
        }


        setupPasswordToggle();
        setupLoginHandler();




        // Keep a mode: 'student' | 'teacher'
        let currentMode = 'student';

        let selectedEntityEmail = null;

        let latestTeacherOptions = [];

        function openModal(mode) {
            currentMode = mode;

            // Update modal titles/labels per mode
            const title = mode === 'student' ? 'Student OFF days' : 'Teacher OFF days';
            const label = mode === 'student' ? 'Student name' : 'Teacher name';
            const tip = mode === 'student'
                ? "Type the student's name to set OFF days."
                : "Type the teacher's name to set OFF days.";

            $('#offModeTitle').textContent = title;
            $('#offNameLabel').textContent = label;
            $('#offNameTip').textContent = tip;
            $('#offEntityName').placeholder = mode === 'student'
                ? "Enter student's name…"
                : "Enter teacher's name…";

            // Reset fields
            $('#offEntityName').value = '';
            $('#offDate').value = '';
            $('#offReason').value = '';         // << add this
            renderWeekdayPill(null);

            selectedEntityEmail = null;


            // clear any previous suggestions
            const sug = $('#nameSuggestions');
            if (sug) { sug.hidden = true; sug.innerHTML = ''; }


            // Show modal
            const m = $('#offdayModal');
            if (m) m.hidden = false;
            $('#offEntityName')?.focus();
        }

        function closeModal() {
            const m = $('#offdayModal');
            if (m) m.hidden = true;
        }

        // also clear suggestions when closing
        const sug2 = $('#nameSuggestions');
        if (sug2) { sug2.hidden = true; sug2.innerHTML = ''; }


        // Convert YYYY-MM-DD to weekday name using local time (avoids UTC off-by-one)
        function weekdayFromISO(isoDate) {
            if (!isoDate) return null;
            const [y, m, d] = isoDate.split('-').map(Number);
            // Local date (year, month-1, day)
            const dt = new Date(y, m - 1, d);
            const names = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            return names[dt.getDay()];
        }

        function renderWeekdayPill(isoDate) {
            const pill = $('#weekdayPill');
            if (!pill) return;

            if (!isoDate) {
                pill.innerHTML = '<span class="weekday-empty">Select a date</span>';
                return;
            }

            const [y, m, d] = isoDate.split('-').map(Number);
            const dt = new Date(y, m - 1, d);

            const weekdayLong = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][dt.getDay()];
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const day = String(d).padStart(2, '0');
            const pretty = `${day} ${months[m - 1]} ${y}`;

            pill.innerHTML = `
    <span class="dow">${weekdayLong}</span>
    <span class="sep">•</span>
    <span class="date">${pretty}</span>
  `;
        }


        // ===== OFFDAY LISTS (teachers + students) =====
        function toISODate(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        // --- Custom week (Monday → Sunday) support ---
        let customWindow = null; // {start: Date, end: Date} or null

        function getMonday(d) {
            const dt = new Date(d.getFullYear(), d.getMonth(), d.getDate());
            const day = dt.getDay();                 // 0=Sun..6=Sat
            const diff = (day === 0 ? -6 : 1 - day); // shift to Monday
            dt.setDate(dt.getDate() + diff);
            return dt;
        }

        function setCustomWeekFromDateISO(iso) {
            if (!iso) { customWindow = null; return; }
            const [y, m, d] = iso.split('-').map(Number);
            const picked = new Date(y, m - 1, d);
            const monday = getMonday(picked);
            const sunday = new Date(monday);
            sunday.setDate(sunday.getDate() + 6);
            customWindow = { start: monday, end: sunday };
        }

        function clearCustomWeek() {
            customWindow = null;
            const inp = document.getElementById('weekPicker');
            if (inp) inp.value = '';
        }


        function computeWindow() {
            // If user picked a custom week (via the date picker), use that
            if (customWindow) {
                return {
                    startISO: toISODate(customWindow.start),
                    endISO: toISODate(customWindow.end),
                    start: new Date(customWindow.start),
                    end: new Date(customWindow.end)
                };
            }

            // Otherwise use the preset (default: Today → +7)
            const today = new Date();
            const preset = (document.getElementById('windowPreset')?.value || '0,7').split(',');
            const past = parseInt(preset[0], 10) || 0;
            const next = parseInt(preset[1], 10) || 7;

            const start = new Date(today); start.setDate(start.getDate() + past);
            const end = new Date(today); end.setDate(end.getDate() + next);
            return { startISO: toISODate(start), endISO: toISODate(end), start, end };
        }



        function prettyDate(iso) {
            const [y, m, d] = iso.split('-').map(Number);
            const dt = new Date(y, m - 1, d);
            return dt.toLocaleDateString(undefined, { weekday: 'long', day: '2-digit', month: 'short', year: 'numeric' });
        }
        function shortDow(iso) {
            const [y, m, d] = iso.split('-').map(Number);
            return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][new Date(y, m - 1, d).getDay()];
        }

        // Teacher off-days within window + resolve + AFFECTED STUDENTS
        async function fetchTeacherOffdaysInWindow(startISO, endISO) {
            // 1) Pull raw off-days
            const { data, error } = await client
                .from('teacher_offdays')
                .select('teacher_id, off_date, reason')
                .gte('off_date', startISO)
                .lte('off_date', endISO)
                .order('off_date', { ascending: true });
            if (error) { console.error(error); return []; }

            // 2) Collect teacher ids + map -> name
            const teacherIds = [...new Set((data || []).map(r => r.teacher_id).filter(Boolean))];
            const idToTeacherName = new Map();
            if (teacherIds.length) {
                const { data: tnames } = await client.from('teachers').select('id, name').in('id', teacherIds);
                (tnames || []).forEach(t => idToTeacherName.set(t.id, t.name));
            }

            // 3) For these teachers, fetch all schedules (student_id, assigned_teacher_id, day_of_week)
            //    We’ll filter by weekday locally per off-date.
            let scheds = [];
            if (teacherIds.length) {
                const { data: sch, error: schErr } = await client
                    .from('student_schedule')
                    .select('student_id, assigned_teacher_id, day_of_week')
                    .in('assigned_teacher_id', teacherIds);
                if (schErr) { console.error(schErr); }
                else { scheds = sch || []; }
            }

            // 4) Resolve student names for any student_id that appears in scheds
            const studentIds = [...new Set(scheds.map(s => s.student_id).filter(Boolean))];
            const idToStudentName = new Map();
            if (studentIds.length) {
                const { data: snames, error: snErr } = await client
                    .from('students')
                    .select('id, name')
                    .in('id', studentIds);
                if (snErr) { console.error(snErr); }
                (snames || []).forEach(s => idToStudentName.set(s.id, s.name));
            }

            // 5) Build final rows with affected students per (teacher, off_date)
            const rows = (data || []).map(r => {
                // weekday index from ISO date (0=Sun..6=Sat)
                const [y, m, d] = r.off_date.split('-').map(Number);
                const weekday = new Date(y, m - 1, d).getDay();

                const affected = scheds
                    .filter(s => s.assigned_teacher_id === r.teacher_id && s.day_of_week === weekday)
                    .map(s => idToStudentName.get(s.student_id))
                    .filter(Boolean);

                // unique + sorted for clarity
                const uniq = Array.from(new Set(affected)).sort((a, b) => a.localeCompare(b));

                // Build both names and ids for assignment UI
                const affectedPairs = scheds
                    .filter(s => s.assigned_teacher_id === r.teacher_id && s.day_of_week === weekday)
                    .map(s => ({ id: s.student_id, name: idToStudentName.get(s.student_id) }))
                    .filter(p => p.id && p.name);

                // unique by id, keep name
                const seen = new Set();
                const affectedInfo = [];
                for (const p of affectedPairs) {
                    if (!seen.has(p.id)) { seen.add(p.id); affectedInfo.push(p); }
                }
                affectedInfo.sort((a, b) => a.name.localeCompare(b.name));

                return {
                    date: r.off_date,
                    offTeacherId: r.teacher_id,
                    who: idToTeacherName.get(r.teacher_id) || 'Unknown',
                    reason: r.reason || '',
                    affectedStudents: affectedInfo.map(p => p.name),        // chips (names)
                    affectedStudentsInfo: affectedInfo,                      // [{id,name}]
                    affectedCount: affectedInfo.length
                };

            });

            return rows;
        }

        // Deterministic hue (0–359) from a string (same name -> same color)
        function hueFromString(s = '') {
            let h = 0;
            for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;

        }



        function initials(name) {

                        '</span>' +
                        '<button class="makeup-edit-btn show-when-assigned" type="button" title="Edit">' +
                        '<i class="fa-regular fa-pen-to-square"></i>' +
                        '</button>';
                }

                const noteView = row.querySelector('.assign-note-text');
                if (noteView) {
                    let txt = 'Make-up: ' + makeupDate;
                    if (makeupTime) txt += ' • ' + makeupTime;
                    if (note) txt += ' • “' + note + '”';
                    noteView.textContent = txt;
                }

                if (noteInput) noteInput.value = '';
            } catch (err) {
                console.error('Save make-up failed:', err);
                alert('Save failed. See console for details.');
            }
        });

        // Make-up: click pencil -> back to edit mode
        document.addEventListener('click', (e) => {
            const btn = e.target.closest('.makeup-edit-btn');
            if (!btn) return;
            const row = btn.closest('.assign-row');
            if (row) row.setAttribute('data-assigned', 'false');
        });


        // --- Resolve or create student/teacher by exact name ---
        async function findOrCreateStudentByName(name) {
            const norm = normalizeName(name);

            const { data: rows, error: selErr } = await client
                .from('students')
                .select('id')
                .eq('name', norm)
                .order('id', { ascending: true })
                .limit(1);

            if (selErr) throw selErr;

            if (rows && rows.length) {
                return rows[0].id;
            }

            const { data: { user } } = await client.auth.getUser();
            const { data: created, error: insErr } = await client
                .from('students')
                .insert({ name: norm, created_by: user?.id || null })
                .select('id')
                .single();

            if (insErr) throw insErr;
            return created.id;
        }


        async function findOrCreateTeacherByName(name) {
            const norm = normalizeName(name);

            // Fetch the FIRST matching row to avoid the maybeSingle() "multiple rows" error
            const { data: rows, error: selErr } = await client
                .from('teachers')
                .select('id')
                .eq('name', norm)
                .order('id', { ascending: true })   // or 'created_at' if you have it
                .limit(1);

            if (selErr) throw selErr;

            if (rows && rows.length) {
                return rows[0].id; // use the first match
            }

            // Create if none found
            const { data: { user } } = await client.auth.getUser();
            const { data: created, error: insErr } = await client
                .from('teachers')
                .insert({ name: norm, created_by: user?.id || null })
                .select('id')
                .single();

            if (insErr) throw insErr;
            return created.id;
        }


        // Wire up triggers
        $('#openStudentOffBtn')?.addEventListener('click', () => openModal('student'));
        $('#openTeacherOffBtn')?.addEventListener('click', () => openModal('teacher'));

        // Modal controls
        $('#offCloseBtn')?.addEventListener('click', closeModal);
        $('#offCancelBtn')?.addEventListener('click', closeModal);
        $('#offdayModal')?.addEventListener('click', (e) => {
            if (e.target.id === 'offdayModal') closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !$('#offdayModal').hidden) closeModal();
        });

        // Date -> weekday display
        $('#offDate')?.addEventListener('change', (e) => {
            const iso = e.target.value;
            renderWeekdayPill(iso);
        });

        // Clear date quickly
        $('#dateClearBtn')?.addEventListener('click', () => {
            const el = $('#offDate');
            if (!el) return;
            el.value = '';
            renderWeekdayPill(null);
            el.focus();
        });

        // Click the left calendar icon -> open the native date picker if supported
        document.querySelector('.date-icon')?.addEventListener('click', () => {
            const el = $('#offDate');
            if (!el) return;
            el.focus();
            if (typeof el.showPicker === 'function') {
                el.showPicker();           // Chrome / Edge / Safari (newer)
            } else {
                el.click();                // fallback (some browsers)
            }
        });


        // Suggest when typing in the name field
        $('#offEntityName')?.addEventListener('input', debouncedSuggest);

        // Hide suggestions when clicking outside the suggestions area
        document.addEventListener('click', (e) => {
            const sug = $('#nameSuggestions');
            if (!sug || sug.hidden) return;
            if (!sug.contains(e.target) && e.target !== $('#offEntityName')) {
                sug.hidden = true; sug.innerHTML = '';
            }
        });

        // Save (UI only)
        // Save -> Supabase upsert
        $('#offSaveBtn')?.addEventListener('click', async () => {
            const name = normalizeName($('#offEntityName')?.value || '');
            const dateIso = $('#offDate')?.value || '';
            const reason = ($('#offReason')?.value || '').trim();

            if (!name) { alert('Please enter a name.'); return; }
            if (!dateIso) { alert('Please choose a date.'); return; }
            if (!client) { alert('Supabase not ready yet.'); return; }

            try {
                // ✅ make sure token/session is fresh before writing
                await ensureAuthFresh();
                const { data: { user } } = await client.auth.getUser();

                if (!user) { alert('Please log in again.'); return; }


                if (currentMode === 'student') {
                    const studentId = await findOrCreateStudentByName(name);
                    const { error } = await client
                        .from('student_offdays')
                        .upsert(
                            {
                                student_id: studentId,
                                off_date: dateIso,
                                reason: reason || null,
                                created_by: user?.id || null,
                                student_email: selectedEntityEmail || null
                            },
                            { onConflict: 'student_id,off_date' }
                        );


                    if (error) throw error;
                    alert(`Student OFF day saved: \n${name} \n${dateIso} (${weekdayFromISO(dateIso)})`);
                } else {
                    const teacherId = await findOrCreateTeacherByName(name);
                    const { error } = await client
                        .from('teacher_offdays')
                        .upsert(
                            {
                                teacher_id: teacherId,
                                off_date: dateIso,
                                reason: reason || null,
                                created_by: user?.id || null,
                                teacher_email: selectedEntityEmail || null
                            },
                            { onConflict: 'teacher_id,off_date' }
                        );


                    if (error) throw error;
                    alert(`Teacher OFF day saved: \n${name} \n${dateIso} (${weekdayFromISO(dateIso)})`);
                }
                await refreshOffdayPanels();
                closeModal();

            } catch (e) {
                console.error('Save OFF day failed:', e);
                alert('Save failed. See console for details.');
            }
        });

    </script>
</body>

</html>
